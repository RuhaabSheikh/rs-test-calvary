name: 'Setup Environment'
description: 'Common setup steps for OpenTofu infrastructure deployment'
inputs:
  aws-region:
    description: 'AWS region for deployment'
    required: false
    default: 'ap-southeast-2'
  aws-role-arn:
    description: 'AWS IAM role ARN to assume'
    required: true
  tofu-version:
    description: 'OpenTofu version to install'
    required: false
    default: '1.12.6'

runs:
  using: 'composite'
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: GitHubActions-${{ github.run_id }}

    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      with:
        tofu_version: ${{ inputs.tofu-version }}
        # No wrapper: cd.yaml reads the real exit code of
        # `tofu plan -detailed-exitcode`, which the wrapper can mask.
        tofu_wrapper: false

    - name: OpenTofu Version
      shell: bash
      run: tofu --version

    - name: Verify AWS Identity
      shell: bash
      run: aws sts get-caller-identity
