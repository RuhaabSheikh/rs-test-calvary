name: 'OpenTofu Output Summary'
description: 'Renders the root module outputs as Markdown and appends it to the job summary'

inputs:
  environment:
    description: 'Target environment — shown in the summary heading'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Build output summary
      shell: bash
      env:
        TARGET_ENV: ${{ inputs.environment }}
      run: |
        tofu output -json > outputs.json

        # Non-empty maps/lists can't be pretty-printed inside a table cell
        # (cells must be one line), so they get a collapsible JSON block
        # instead. Everything else, including sensitive values, goes in the table.
        STRUCTURED='def structured:
          (.sensitive | not)
          and (.value | type == "object" or type == "array")
          and (.value | length) > 0;'

        {
          echo "### Outputs — \`${TARGET_ENV}\`"
          echo ""

          if [ "$(jq 'length' outputs.json)" -eq 0 ]; then
            echo "No outputs."
          fi

          # Sensitive outputs are masked: the job summary is readable by
          # anyone with read access to the repository.
          jq -r "${STRUCTURED}"'
            [ to_entries[] | select(.value | structured | not) ]
            | if length == 0 then
                empty
              else
                "| Output | Value |",
                "|---|---|",
                ( .[]
                  | "| `" + .key + "` | "
                    + ( if .value.sensitive then
                          "_(sensitive)_"
                        else
                          .value.value
                          | (if type == "string" then . else tojson end)
                          | gsub("\\|"; "\\|")
                          | gsub("\n"; "<br>")
                          | "`" + . + "`"
                        end )
                    + " |" )
              end
          ' outputs.json

          jq -r "${STRUCTURED}"' to_entries[] | select(.value | structured) | .key' outputs.json \
            | while read -r key; do
                echo ""
                echo "<details><summary><code>${key}</code></summary>"
                echo ""
                echo '```json'
                jq --arg k "$key" '.[$k].value' outputs.json
                echo '```'
                echo ""
                echo "</details>"
              done
        } > outputs.md
        # outputs.json holds sensitive values in plain text — drop it.
        rm -f outputs.json

    - name: Job summary
      shell: bash
      run: cat outputs.md >> "$GITHUB_STEP_SUMMARY"
