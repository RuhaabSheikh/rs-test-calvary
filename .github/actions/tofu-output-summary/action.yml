name: 'OpenTofu Output Summary'
description: 'Renders the root module outputs as a Markdown table and appends it to the job summary'

inputs:
  environment:
    description: 'Target environment — shown in the summary heading'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Build output summary
      shell: bash
      env:
        TARGET_ENV: ${{ inputs.environment }}
      run: |
        tofu output -json > outputs.json
        {
          echo "### Outputs — \`${TARGET_ENV}\`"
          echo ""
          # Sensitive outputs are masked: the job summary is readable by
          # anyone with read access to the repository.
          jq -r '
            # Indented JSON, like `jq .` (jq has no built-in to pretty-print
            # into a string). Empty maps/lists stay on one line.
            def pretty($indent):
              if type == "object" and length > 0 then
                "{\n"
                + ( to_entries
                    | map($indent + "  " + (.key | tojson) + ": " + (.value | pretty($indent + "  ")))
                    | join(",\n") )
                + "\n" + $indent + "}"
              elif type == "array" and length > 0 then
                "[\n"
                + ( map($indent + "  " + pretty($indent + "  ")) | join(",\n") )
                + "\n" + $indent + "]"
              else
                tojson
              end;

            # A table row must be a single line, so the value is raw HTML:
            # <br> for newlines, &nbsp; for indentation, <pre> to keep
            # structured values laid out. Markdown still applies inside raw
            # HTML, so its special characters become entities too.
            def cell:
              (type == "object" or type == "array") as $structured
              | (if type == "string" then . elif $structured then pretty("") else tojson end)
              | gsub("&"; "&amp;")
              | gsub("<"; "&lt;")
              | gsub(">"; "&gt;")
              | gsub("(?<c>[\\\\`*_\\[\\]~])"; "&#\(.c | explode[0]);")
              | gsub("\\|"; "\\|")
              | split("\n")
              | map(
                  capture("^(?<lead> *)(?<rest>.*)$")
                  | (.lead | gsub(" "; "&nbsp;")) + .rest
                )
              | join("<br>")
              | if $structured and (contains("<br>")) then
                  "<pre>" + . + "</pre>"
                else
                  "<code>" + . + "</code>"
                end;

            to_entries as $outputs
            | if ($outputs | length) == 0 then
                "No outputs."
              else
                "| Output | Value |",
                "|---|---|",
                ( $outputs[]
                  | "| `" + .key + "` | "
                    + (if .value.sensitive then "_(sensitive)_" else .value.value | cell end)
                    + " |" )
              end
          ' outputs.json
        } > outputs.md
        # outputs.json holds sensitive values in plain text — drop it.
        rm -f outputs.json

    - name: Job summary
      shell: bash
      run: cat outputs.md >> "$GITHUB_STEP_SUMMARY"
