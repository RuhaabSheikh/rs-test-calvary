name: "CD Pipeline"
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Break-glass deploy to {0} ({1})', inputs.environment, inputs.ref) || format('Deploy: {0}', github.event.head_commit.message) }}"

# plan every environment > then per environment, one at a time:
#   approve the plan (GitHub Environment) > apply the saved plan
#
#   - merge to main       -> deploys the GitHub Environments on the repo that
#                            are in the promotion order, lowest first. A
#                            failure stops the pipeline, so higher
#                            environments are never reached.
#   - workflow_dispatch   -> break-glass: deploys exactly one environment from
#                            any ref, without going through test first.
on:
  push:
    branches:
      - main
    paths:
      - "*.tf"
      - "environments/*.tfvars"
      - "environments/*.tfbackend"
      - "scripts/**"
      - ".github/actions/**"
      - ".github/workflows/ci.yaml"
      - ".github/workflows/cd.yaml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        type: choice
        options:
          - test
          - prod
        required: true
      ref:
        description: "Git ref to deploy (branch, tag or SHA)"
        type: string
        default: main

permissions:
  id-token: write
  contents: read

jobs:
  environments:
    name: "Resolve environments"
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      list: ${{ steps.resolve.outputs.list }}

    steps:
      # A dispatch deploys just the chosen environment; a merge deploys the
      # GitHub Environments configured on the repository that appear in
      # PROMOTION_ORDER, in that order.
      - name: Resolve environments
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_ENV: ${{ inputs.environment }}
          # Lowest to highest. An environment not listed here is not deployed.
          PROMOTION_ORDER: '["dev","sit","test","uat","preprod","prod"]'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            list=$(jq -nc --arg env "$DISPATCH_ENV" '[$env]')
          else
            list=$(gh api "repos/${GITHUB_REPOSITORY}/environments" --paginate --jq '.environments[].name' \
              | jq -Rnc --argjson order "$PROMOTION_ORDER" \
                  '[inputs] as $envs | $order | map(select(IN($envs[])))')
          fi

          if [ "$list" = "[]" ]; then
            echo "::error::No GitHub Environments from the promotion order are configured on this repository."
            exit 1
          fi

          echo "list=${list}" >> "$GITHUB_OUTPUT"

  plan:
    name: "Plan (${{ matrix.environment }})"
    needs: environments
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.environments.outputs.list) }}
    outputs:
      sha: ${{ steps.checkout.outputs.commit }}

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Extend Git credentials
        uses: de-vri-es/setup-git-credentials@5dd446b3857806f44ea73acf83c193190a385d63 # v2.2.0
        with:
          credentials: https://user:${{ steps.generate-token.outputs.token }}@github.com

      # On merge: the merge commit, not whatever main points at now.
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: OpenTofu Init
        uses: ./.github/actions/tofu-init
        with:
          environment: ${{ matrix.environment }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          tofu-version: "1.12.6"

      # This is the plan the approver reviews before the apply job runs.
      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes to apply.
      - name: OpenTofu Plan
        id: plan
        env:
          TARGET_ENV: ${{ matrix.environment }}
        run: |
          exit_code=0
          # shellcheck disable=SC2086 # TOFU_VAR_FILES holds two separate flags
          tofu plan -input=false -lock-timeout=5m -detailed-exitcode $TOFU_VAR_FILES -out=tfplan || exit_code=$?

          case "$exit_code" in
            0)
              echo "${TARGET_ENV}=false" >> "$GITHUB_OUTPUT"
              echo "::notice::No changes in ${TARGET_ENV} plan - apply will be skipped."
              ;;
            2)
              echo "${TARGET_ENV}=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit "$exit_code"
              ;;
          esac

      - name: Plan summary
        uses: ./.github/actions/tofu-plan-summary
        with:
          environment: ${{ matrix.environment }}

      # The lock file goes too: no .terraform.lock.hcl is committed, so the
      # apply job must resolve the identical provider versions.
      - name: Upload plan
        if: steps.plan.outputs[matrix.environment] == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan-${{ matrix.environment }}-${{ github.run_id }}
          path: |
            tfplan
            .terraform.lock.hcl
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  changes:
    name: "Resolve changes"
    # Needs every plan to succeed: a failed plan in any environment stops the
    # pipeline before anything is applied.
    needs: [environments, plan]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      environments: ${{ steps.filter.outputs.environments }}

    steps:
      # A plan is only uploaded when it has changes, so the uploaded plans are
      # the environments to apply. Order is kept from the resolved list.
      - name: Filter environments with changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENTS: ${{ needs.environments.outputs.list }}
        run: |
          plans=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --paginate --jq '.artifacts[].name')

          changed=$(jq -c --arg plans "$plans" --arg run "$GITHUB_RUN_ID" \
            '($plans | split("\n")) as $names | map(select("tfplan-\(.)-\($run)" | IN($names[])))' <<< "$ENVIRONMENTS")

          echo "environments=${changed}" >> "$GITHUB_OUTPUT"

  apply:
    name: "Apply (${{ matrix.environment }})"
    needs: [plan, changes]
    # Nothing to apply (and nobody to bother for approval) if every plan is empty.
    if: needs.changes.outputs.environments != '[]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    strategy:
      # In matrix order, one at a time; the first failure cancels the rest.
      max-parallel: 1
      fail-fast: true
      matrix:
        # Only the environments whose plan has changes, in promotion order. The matrix
        # context is not available in a job-level `if`, so an empty plan is
        # dropped here rather than skipped there.
        environment: ${{ fromJSON(needs.changes.outputs.environments) }}

    # One apply per environment at a time, queued rather than cancelled.
    concurrency:
      group: opentofu-cd-${{ matrix.environment }}
      cancel-in-progress: false

    # Approval gate — required reviewers are set on the "test" / "prod"
    # GitHub Environments. The plan to review is in the run summary.
    environment: ${{ matrix.environment }}

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Extend Git credentials
        uses: de-vri-es/setup-git-credentials@5dd446b3857806f44ea73acf83c193190a385d63 # v2.2.0
        with:
          credentials: https://user:${{ steps.generate-token.outputs.token }}@github.com

      # The exact commit that was planned, not the current tip of the ref.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: ${{ needs.plan.outputs.sha }}

      # After checkout — checkout cleans the workspace and would remove these.
      - name: Download plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tfplan-${{ matrix.environment }}-${{ github.run_id }}

      - name: OpenTofu Init
        uses: ./.github/actions/tofu-init
        with:
          environment: ${{ matrix.environment }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          tofu-version: "1.12.6"

      # Saved plan: no -var-file (the values are baked in). A stale plan fails
      # rather than applying something unreviewed — re-run the workflow.
      - name: OpenTofu Apply
        run: tofu apply -input=false -lock-timeout=5m tfplan

      - name: Job summary
        env:
          TARGET_ENV: ${{ matrix.environment }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          {
            echo "## OpenTofu Apply — \`${TARGET_ENV}\`"
            echo ""
            echo "Applied the reviewed plan at \`${SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"
