name: "CD Pipeline"
run-name: "Deploy to ${{ inputs.environment }} (${{ inputs.ref }})"

# Manual only. One run targets exactly one environment:
#   init > plan > approve (GitHub Environment) > apply the saved plan
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        type: choice
        options:
          - test
          - prod
        required: true
      ref:
        description: "Git ref to deploy (branch, tag or SHA)"
        type: string
        default: main

# One CD run per environment at a time, queued rather than cancelled.
concurrency:
  group: opentofu-cd-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.checkout.outputs.commit }}
      has_changes: ${{ steps.plan.outputs.has_changes }}

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Extend Git credentials
        uses: de-vri-es/setup-git-credentials@5dd446b3857806f44ea73acf83c193190a385d63 # v2.2.0
        with:
          credentials: https://user:${{ steps.generate-token.outputs.token }}@github.com

      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: ${{ inputs.ref }}

      - name: OpenTofu Init
        uses: ./.github/actions/tofu-init
        with:
          environment: ${{ inputs.environment }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          tofu-version: "1.12.6"

      # This is the plan the approver reviews before the apply job runs.
      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes to apply.
      - name: OpenTofu Plan
        id: plan
        run: |
          exit_code=0
          # shellcheck disable=SC2086 # TOFU_VAR_FILES holds two separate flags
          tofu plan -input=false -lock-timeout=5m -detailed-exitcode $TOFU_VAR_FILES -out=tfplan || exit_code=$?

          case "$exit_code" in
            0)
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "::notice::No changes in plan - apply will be skipped."
              ;;
            2)
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit "$exit_code"
              ;;
          esac

      - name: Plan summary
        uses: ./.github/actions/tofu-plan-summary
        with:
          environment: ${{ inputs.environment }}

      # The lock file goes too: no .terraform.lock.hcl is committed, so the
      # apply job must resolve the identical provider versions.
      - name: Upload plan
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            tfplan
            .terraform.lock.hcl
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  apply:
    # Static name: GitHub does not evaluate expressions in the name of a
    # skipped job, so it would render literally. The environment is in run-name.
    name: Apply
    needs: plan
    # Nothing to apply (and nobody to bother for approval) on an empty plan.
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    # Approval gate — required reviewers are set on the "test" / "prod"
    # GitHub Environments.
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
      packages: read

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Extend Git credentials
        uses: de-vri-es/setup-git-credentials@5dd446b3857806f44ea73acf83c193190a385d63 # v2.2.0
        with:
          credentials: https://user:${{ steps.generate-token.outputs.token }}@github.com

      # The exact commit that was planned, not the current tip of inputs.ref.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: ${{ needs.plan.outputs.sha }}

      # After checkout — checkout cleans the workspace and would remove these.
      - name: Download plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.run_id }}

      - name: OpenTofu Init
        uses: ./.github/actions/tofu-init
        with:
          environment: ${{ inputs.environment }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          tofu-version: "1.12.6"

      # Saved plan: no -var-file (the values are baked in). A stale plan fails
      # rather than applying something unreviewed — re-run the workflow.
      - name: OpenTofu Apply
        run: tofu apply -input=false -lock-timeout=5m tfplan

      - name: Job summary
        env:
          TARGET_ENV: ${{ inputs.environment }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          {
            echo "## OpenTofu Apply — \`${TARGET_ENV}\`"
            echo ""
            echo "Applied the reviewed plan at \`${SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"
